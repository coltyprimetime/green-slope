<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="Green slope: set the glasses on the green pointed at the hole, hear the slope.">
<title>Slope</title>
<!-- GREEN SLOPE READER — Coleton, 2026-09-06, built on the course.
     WHAT IT DOES: reads the motion sensor while the device lies FLAT on the
     green with its front pointed at the hole, and speaks the slope: percent,
     uphill/downhill toward the hole, and which way it falls (break left or
     right). That is the same measurement a phone laid on the green makes.
     WHAT IT DOES NOT DO: it does not know the green between you and the hole.
     One spot, one reading. It says "at this spot" out loud on purpose.
     WORKS ON: the Ray-Ban Display (DeviceOrientation is a supported web-app
     API per Meta's build guide) AND a phone browser — same file, so the
     phone is the fallback if the glasses ever stop reporting the sensor.
     DISPLAY RULES: 600x600, #000 is transparent on the additive screen, big
     high-contrast text, pinch = Enter, D-pad = arrows, no scrolling.
     SECURITY: public origin, no token, no secret, nothing to protect. -->
<style>
  html, body { margin:0; padding:0; background:#000; }
  body { width:600px; height:600px; overflow:hidden; padding:24px; box-sizing:border-box;
         font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff;
         -webkit-font-smoothing:antialiased; touch-action:manipulation; user-select:none; }
  .wrap { height:552px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .big { font-size:132px; font-weight:800; line-height:1; letter-spacing:-4px; }
  .big small { font-size:56px; font-weight:700; letter-spacing:0; }
  .dir { font-size:44px; font-weight:700; margin-top:10px; }
  .note { font-size:22px; color:#c8d0dc; margin-top:18px; line-height:1.3; }
  .hint { font-size:20px; color:#8a94a6; margin-top:26px; }
  .arrow { font-size:96px; line-height:1; margin-top:4px; }
  .warn { color:#ffd166; }
  .ok { color:#7CFF9E; }
  button { position:absolute; left:-9999px; }   /* focus target for Enter/pinch; never drawn */
  .live { font-size:20px; color:#8a94a6; position:absolute; top:24px; right:24px; }
</style>
</head>
<body>
<button id="k" class="focusable" autofocus aria-label="read slope"></button>
<div class="live" id="live"></div>
<div class="wrap" id="wrap">
  <div class="dir" id="title">GREEN SLOPE</div>
  <div class="note" id="msg">Set the glasses on the green like<br>the ground is wearing them, lenses at the hole.<br>Pinch when they're down.</div>
  <div class="hint">Or on a phone: lay it flat, top toward the hole, tap.</div>
</div>
<script>
(function () {
  'use strict';
  // v2 (2026-09-06, from the course). v1 assumed a phone lying flat and read
  // 687% for glasses set down upright — "like the ground is wearing them".
  // Upright, the W3C Euler angles sit at beta≈90°, a singularity where gamma
  // is meaningless. So v2 works from the GRAVITY VECTOR in the device frame
  // and picks the pose by which axis gravity runs along:
  //   flat (phone on its back)      → gravity along z
  //   upright (glasses, worn pose)  → gravity along y
  // Percent is exact either way. The two SIGNS (uphill/downhill, left/right)
  // depend on how the hardware labels its axes, which cannot be verified
  // from a desk — so both are flippable on the D-pad and remembered.
  var G = { x: null, y: null, z: null, at: 0 };
  var live = document.getElementById('live');
  var wrap = document.getElementById('wrap');
  var armed = false;
  var flip = { pitch: load('flipPitch'), brk: load('flipBreak') };

  function load(k) { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } }
  function save(k, v) { try { localStorage.setItem(k, v ? '1' : '0'); } catch (e) {} }

  function say(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stamp(x, y, z, src) {
    G.x = x; G.y = y; G.z = z; G.at = Date.now();
    live.textContent = 'sensor live (' + src + ')'; live.className = 'live ok';
  }
  // Preferred: the accelerometer's own gravity vector. No Euler angles at all.
  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a || a.x === null || a.y === null || a.z === null) return;
    stamp(a.x, a.y, a.z, 'motion');
  }
  // Fallback: rebuild the up-vector from beta/gamma. Third row of the W3C
  // rotation Rz(a)Rx(b)Ry(g): (-cos b sin g, sin b, cos b cos g). Flat → z,
  // upright → y. Alpha cancels, which is why no compass is needed.
  function onOrient(e) {
    if (G.at && Date.now() - G.at < 800 && live.textContent.indexOf('motion') > -1) return;
    if (e.beta === null || e.gamma === null) return;
    var b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    stamp(-Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g), 'orientation');
  }

  function listen() {
    window.addEventListener('devicemotion', onMotion, true);
    window.addEventListener('deviceorientation', onOrient, true);
  }
  function arm() {
    if (armed) return Promise.resolve(true);
    armed = true;
    var DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
    var asks = [];
    if (DOE && typeof DOE.requestPermission === 'function') asks.push(DOE.requestPermission().catch(function () { return 'denied'; }));
    if (DME && typeof DME.requestPermission === 'function') asks.push(DME.requestPermission().catch(function () { return 'denied'; }));
    return Promise.all(asks).then(function () { listen(); return true; });
  }

  function read() {
    if (G.x === null || Date.now() - G.at > 3000) {
      show('--', '', 'No sensor reading yet.', 'If this stays, open the same link on your phone and lay it flat.', true);
      say('No sensor reading yet. Try the phone.');
      return;
    }
    var x = G.x, y = G.y, z = G.z;
    var upright = Math.abs(y) >= Math.abs(z);
    // along = tilt toward/away from the hole; across = tilt left/right.
    // Upright, lenses toward the hole: hole direction is along z, sideways is x.
    // Flat, top toward the hole: hole direction is along y, sideways is x.
    var along = upright ? Math.atan2(z, Math.abs(y)) : Math.atan2(y, Math.abs(z));
    var across = upright ? Math.atan2(x, Math.abs(y)) : Math.atan2(x, Math.abs(z));
    if (flip.pitch) along = -along;
    if (flip.brk) across = -across;
    var pct = Math.sqrt(Math.tan(along) * Math.tan(along) + Math.tan(across) * Math.tan(across)) * 100;
    var eps = 0.4 * Math.PI / 180;
    var toward = Math.abs(along) < eps ? 'flat' : (along > 0 ? 'uphill' : 'downhill');
    var fall = Math.abs(across) < eps ? 'no break' : (across > 0 ? 'breaks left' : 'breaks right');
    var arrow = Math.abs(across) < eps ? '•' : (across > 0 ? '⟵' : '⟶');
    show(pct.toFixed(1), '%', toward + '  ·  ' + fall,
         arrow + '   at this spot only' + (upright ? '' : '  ·  phone flat'), false);
    say(pct < 0.5 ? 'Flat at this spot. Under half a percent.'
                  : pct.toFixed(1) + ' percent, ' + toward + ', ' + fall + '. At this spot only.');
  }

  function show(big, unit, dir, note, warn) {
    wrap.innerHTML =
      '<div class="big">' + big + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      '<div class="dir' + (warn ? ' warn' : '') + '">' + dir + '</div>' +
      '<div class="note">' + note + '</div>' +
      '<div class="hint">Pinch: read again · swipe left/right: flip break · swipe up/down: flip uphill</div>';
  }

  function trigger() { arm().then(read); }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); flip.brk = !flip.brk; save('flipBreak', flip.brk);
      say('Break direction flipped.'); arm().then(read); return;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); flip.pitch = !flip.pitch; save('flipPitch', flip.pitch);
      say('Uphill downhill flipped.'); arm().then(read);
    }
  }, true);
  document.addEventListener('click', trigger, true);

  var DOE = window.DeviceOrientationEvent;
  if (!(DOE && typeof DOE.requestPermission === 'function')) { armed = true; listen(); }
  try { document.getElementById('k').focus(); } catch (e) {}
  live.textContent = 'waiting for sensor';
})();
</script>
</body>
</html>
